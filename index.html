        const timeValueInput = document.getElementById('timeValue');
        const aiInput = document.getElementById('aiInput');
        const aiRecognizeBtn = document.getElementById('aiRecognizeBtn');
        
        // 当前生成的计划数据
        let currentPlan = null;

        function getTodayDateString() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function parseDateString(dateString) {
            const [year, month, day] = (dateString || getTodayDateString()).split('-').map(Number);
            return new Date(year, month - 1, day);
        }

        function getPlanPeriodCount(plan, item) {
            if (item.planCount && item.planCount > 0) {
                return item.planCount;
            }

            if (item.type === 'words') {
                return plan.timeUnit === 'weeks' ? plan.timeValue : plan.totalDays;
            }

            return plan.totalDays;
        }

        function getPlanUnit(plan, item) {
            if (item.planUnit) {
                return item.planUnit;
            }

            if (item.type === 'words') {
                return plan.timeUnit || 'days';
            }

            return 'days';
        }

        function getPlanUnitSuffix(plan, item) {
            if (item.type !== 'words') {
                return '';
            }

            return getPlanUnit(plan, item) === 'weeks' ? '/周' : '/天';
        }

        function getDefaultDailyAmount(item, planCount) {
            if (item.type === 'reading') {
                return 5;
            }

            if (item.type === 'listening' || item.type === 'speaking') {
                return 1;
            }

            return Math.max(Math.ceil(item.remaining / planCount) || 1, 1);
        }

        function getDefaultDailyAmountForSelectedItem(item, selectedHomework, totalDays) {
            if (item.type === 'words' || item.type === 'listening' || item.type === 'speaking') {
                return getDefaultDailyAmount(item, item.type === 'words' ? item.planCount : totalDays);
            }

            const sameTypeRemaining = selectedHomework
                .filter(homeworkItem => homeworkItem.type === item.type)
                .reduce((sum, homeworkItem) => sum + homeworkItem.remaining, 0);

            if (item.type === 'reading') {
                return 5;
            }

            return Math.max(Math.ceil(sameTypeRemaining / totalDays) || 1, 1);
        }

        function buildDailyHomework(selectedHomework, totalDays) {
            return selectedHomework.map(item => {
                const planCount = item.type === 'words' ? item.planCount : totalDays;
                const dailyAmount = getDefaultDailyAmountForSelectedItem(item, selectedHomework, totalDays);

                return {
                    ...item,
                    dailyAmount: dailyAmount,
                    remainder: item.remaining % planCount
                };
            });
        }

        function getBaseTotal(plan, item) {
            if (item.baseTotal) {
                return item.baseTotal;
            }

            const stageData = getCourseStageData(plan.courseStage, plan.courseType) || {};
            const typeData = stageData[item.type] || [];
            const matchedItem = typeData.find(typeItem => typeItem.name === item.name);

            return matchedItem ? matchedItem.total : item.total;
        }

        function getCycleCount(plan, item) {
            if (item.cycleCount) {
                return item.cycleCount;
            }

            if (item.type !== 'words') {
                return 1;
            }

            const baseTotal = getBaseTotal(plan, item) || item.total;
            return Math.max(Math.round((item.total || baseTotal) / baseTotal), 1);
        }

        function getRoundText(roundNumber) {
            const roundTexts = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
            return `第${roundTexts[roundNumber - 1] || roundNumber}轮`;
        }

        function updateHomeworkPlanStats(plan, item) {
            const planCount = getPlanPeriodCount(plan, item);
            const dailyAmount = Math.max(parseInt(item.dailyAmount) || 1, 1);
            const scheduledTotal = dailyAmount * planCount;
            const unfinished = Math.max(item.remaining - scheduledTotal, 0);

            item.planCount = planCount;
            item.planUnit = getPlanUnit(plan, item);
            item.dailyAmount = dailyAmount;
            item.unfinished = unfinished;
            item.planRemainder = unfinished;
            item.planStatusText = `${unfinished} ${item.unit}`;

            return item;
        }

        function normalizePlanRecord(plan) {
            if (!plan) {
                return null;
            }

            plan.startDate = plan.startDate || getTodayDateString();
            plan.totalDays = plan.totalDays || (plan.timeUnit === 'weeks' ? plan.timeValue * 7 : plan.timeValue);
            plan.homework = (plan.homework || []).map(item => {
                const normalizedItem = { ...item };
                normalizedItem.remaining = typeof normalizedItem.remaining === 'number'
                    ? normalizedItem.remaining
                    : Math.max((normalizedItem.total || 0) - (normalizedItem.completed || 0), 0);

                const planCount = getPlanPeriodCount(plan, normalizedItem);
                normalizedItem.planCount = planCount;
                normalizedItem.planUnit = getPlanUnit(plan, normalizedItem);
                normalizedItem.baseTotal = getBaseTotal(plan, normalizedItem);
                normalizedItem.cycleCount = getCycleCount(plan, normalizedItem);
                normalizedItem.dailyAmount = Math.max(
                    parseInt(normalizedItem.dailyAmount) || getDefaultDailyAmount(normalizedItem, planCount),
                    1
                );

                return normalizedItem;
            });

            plan.progressHomework = (plan.progressHomework || plan.homework || []).map(item => {
                const normalizedItem = { ...item };
                const total = Number(normalizedItem.total) || 0;
                const completed = Math.min(Number(normalizedItem.completed) || 0, total);

                normalizedItem.completed = completed;
                normalizedItem.remaining = Math.max(total - completed, 0);

                return normalizedItem;
            });

            updatePlanSequencedStats(plan);

            return plan;
        }

        function getCumulativeAmounts(plan, item) {
            const amounts = Array(plan.totalDays).fill('');
            const planCount = getPlanPeriodCount(plan, item);
            const dailyAmount = Math.max(parseInt(item.dailyAmount) || 1, 1);
            let scheduledAmount = Math.min(item.remaining, dailyAmount * planCount);

            if (getPlanUnit(plan, item) === 'weeks') {
                for (let i = 0; i < planCount && scheduledAmount > 0; i++) {
                    const dayIndex = i * 7;
                    if (dayIndex >= plan.totalDays) {
                        break;
                    }

                    const amount = Math.min(dailyAmount, scheduledAmount);
                    amounts[dayIndex] = amount;
                    scheduledAmount -= amount;
                }
            } else {
                for (let i = 0; i < plan.totalDays && scheduledAmount > 0; i++) {
                    const amount = Math.min(dailyAmount, scheduledAmount);
                    amounts[i] = amount;
                    scheduledAmount -= amount;
                }
            }

            return amounts;
        }

        function getScheduleByItem(plan) {
            const nextDayByType = {};

            return plan.homework.map(item => {
                if (item.type === 'words') {
                    return getCumulativeAmounts(plan, item);
                }

                const amounts = Array(plan.totalDays).fill('');
                const dailyAmount = Math.max(parseInt(item.dailyAmount) || 1, 1);
                let remainingAmount = Math.max(Number(item.remaining) || 0, 0);
                let dayIndex = nextDayByType[item.type] || 0;

                while (dayIndex < plan.totalDays && remainingAmount > 0) {
                    const amount = Math.min(dailyAmount, remainingAmount);
                    amounts[dayIndex] = amount;
                    remainingAmount -= amount;
                    dayIndex += 1;
                }

                nextDayByType[item.type] = dayIndex;

                return amounts;
            });
        }

        function updatePlanSequencedStats(plan) {
            const scheduleByItem = getScheduleByItem(plan);

            plan.homework.forEach((item, index) => {
                const scheduledTotal = scheduleByItem[index].reduce((sum, amount) => sum + (Number(amount) || 0), 0);
                const unfinished = Math.max((Number(item.remaining) || 0) - scheduledTotal, 0);

                item.planCount = getPlanPeriodCount(plan, item);
                item.planUnit = getPlanUnit(plan, item);
                item.dailyAmount = Math.max(parseInt(item.dailyAmount) || 1, 1);
                item.unfinished = unfinished;
                item.planRemainder = unfinished;
                item.planStatusText = `${unfinished} ${item.unit}`;
            });

            return scheduleByItem;
        }

        function buildTablePlainText(table) {

            table.querySelectorAll('tr').forEach(row => {

        function copyShimoTable(table) {
            const wrapper = document.getElementById('shimoTableWrapper') || table;
            const selection = window.getSelection();
            const range = document.createRange();
            range.selectNode(wrapper);
            selection.removeAllRanges();
            selection.addRange(range);

            const copied = document.execCommand('copy');
            selection.removeAllRanges();

            if (copied) {
                return true;
            }

            const textarea = document.createElement('textarea');
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            textarea.value = buildTablePlainText(table);
            document.body.appendChild(textarea);
            textarea.select();
            const fallbackCopied = document.execCommand('copy');
            document.body.removeChild(textarea);

            return fallbackCopied;
        }

        function getAssignedSummaries(record) {
            const plan = clonePlanRecord(record);
            const scheduleByItem = updatePlanSequencedStats(plan);

            return plan.homework.map((item, index) => {
                const assignedTotal = scheduleByItem[index].reduce((sum, amount) => sum + (Number(amount) || 0), 0);
                const previousCompleted = Number(item.completed) || 0;
                const total = Number(item.total) || 0;
                const afterCompleted = Math.min(previousCompleted + assignedTotal, total);

                return {
                    item,
                    assignedTotal,
                    previousCompleted,
                    afterCompleted,
                    remainingAfter: Math.max(total - afterCompleted, 0)
                };
            });
        }

        function buildProgressPlanFromHistory(record) {
            const plan = clonePlanRecord(record);
            const summaries = getAssignedSummaries(plan);
            const summaryByItem = new Map(summaries.map(summary => [
                `${summary.item.type}__${summary.item.name}`,
                summary
            ]));

            plan.startDate = getTodayDateString();
            plan.homework = plan.homework.map((item, index) => {
                const summary = summaries[index];
                const completed = summary ? summary.afterCompleted : Number(item.completed) || 0;

                return {
                    ...item,
                    completed,
                    remaining: Math.max((Number(item.total) || 0) - completed, 0)
                };
            });
            plan.progressHomework = getProgressHomework(plan).map(item => {
                const summary = summaryByItem.get(`${item.type}__${item.name}`);
                const completed = summary ? summary.afterCompleted : Number(item.completed) || 0;

                return {
                    ...item,
                    completed,
                    remaining: Math.max((Number(item.total) || 0) - completed, 0)
                };
            });

            return plan;
        }

        function getProgressHomework(plan) {
            const progressItems = plan.progressHomework && plan.progressHomework.length

            return progressItems.map(item => {
                const total = Number(item.total) || 0;
                const completed = Math.min(Number(item.completed) || 0, total);

        function normalizeRecognitionText(text) {
            return text.toLowerCase().replace(/\s+/g, '');
        }

        function inferStudentGrade(text) {
            const normalizedText = normalizeRecognitionText(text);

            if (/(初中|初一|初二|初三|初1|初2|初3|七年级|八年级|九年级|7年级|8年级|9年级)/.test(normalizedText)) {
                return '初中生';
            }

            if (/(高中|高一|高二|高三|高1|高2|高3)/.test(normalizedText)) {
                return '高中生';
            }

            if (/(本科|大学|大一|大二|大三|大四)/.test(normalizedText)) {
                return '本科生';
            }

            if (/(小学|一年级|二年级|三年级|四年级|五年级|六年级|1年级|2年级|3年级|4年级|5年级|6年级)/.test(normalizedText)) {
                return '小学生';
            }

            return '';
        }

        function inferCourseInfo(text) {
            const normalizedText = normalizeRecognitionText(text);

            if (
                normalizedText.includes('prea') ||
                normalizedText.includes('prea班')
            ) {
                return {
                    courseType: '基础段',
                    courseStage: '基础段-pre A'
                };
            }

            if (
                normalizedText.includes('寒假基础a班') ||
                normalizedText.includes('基础a班') ||
                normalizedText.includes('基础a段') ||
                normalizedText.includes('a阶段')
            ) {
                return {
                    courseType: '基础段',
                    courseStage: '基础段-A阶段'
                };
            }

            if (
                normalizedText.includes('preb') ||
                normalizedText.includes('preb班') ||
                normalizedText.includes('寒假基础b班') ||
                normalizedText.includes('基础b班') ||
                normalizedText.includes('基础b段') ||
                normalizedText.includes('基础b阶段') ||
                normalizedText.includes('b阶段')
            ) {
                return {
                    courseType: '基础段',
                    courseStage: '基础段-B阶段'
                };
            }

            if (normalizedText.includes('雅思') && normalizedText.includes('进阶')) {
                return {
                    courseType: '雅思',
                    courseStage: '雅思-进阶段'
                };
            }

            if (normalizedText.includes('雅思') && (normalizedText.includes('精品') || normalizedText.includes('6分'))) {
                return {
                    courseType: '雅思',
                    courseStage: '雅思-精品段/6分段'
                };
            }

            if (normalizedText.includes('雅思') && normalizedText.includes('强化')) {
                return {
                    courseType: '雅思',
                    courseStage: '雅思-强化段'
                };
            }

            if (normalizedText.includes('雅思') && normalizedText.includes('冲刺')) {
                return {
                    courseType: '雅思',
                    courseStage: '雅思-冲刺段'
                };
            }

            if (normalizedText.includes('托福') && normalizedText.includes('进阶')) {
                return {
                    courseType: '托福',
                    courseStage: '托福-进阶段'
                };
            }

            if (normalizedText.includes('托福') && (normalizedText.includes('精品') || normalizedText.includes('4.5'))) {
                return {
                    courseType: '托福',
                    courseStage: '托福-精品段/4-4.5分段'
                };
            }

            if (normalizedText.includes('托福') && normalizedText.includes('强化')) {
                return {
                    courseType: '托福',
                    courseStage: '托福-强化段'
                };
            }

            if (normalizedText.includes('托福') && (normalizedText.includes('冲刺') || normalizedText.includes('5.5'))) {
                return {
                    courseType: '托福',
                    courseStage: '托福-冲刺段5-5.5分段'
                };
            }

            if (normalizedText.includes('托福') && normalizedText.includes('5.5分段')) {
                return {
                    courseType: '托福',
                    courseStage: '托福-5.5分段'
                };
            }

            return {
                courseType: '',
                courseStage: ''
            };
        }

        // 生成每日计划
        generateBtn.addEventListener('click', function() {
            const studentName = studentNameInput.value.trim();
            const studentGrade = studentGradeInput.value;
            const courseType = courseTypeSelect.value;
            const courseStage = courseStageSelect.value;
            const startDate = startDateInput.value || getTodayDateString();
            const timeValue = parseInt(timeValueInput.value);
            const timeUnit = timeUnitSelect.value;
            
            // 验证输入
            if (!studentName) {
                alert('请输入学生姓名');
                return;
            }
            
            if (!studentGrade) {
                alert('请选择年级');
                return;
            }
            
            if (!courseType || !courseStage) {
                alert('请选择课程类型和阶段');
                return;
            }
            
            if (!timeValue || timeValue <= 0) {
                alert('请输入有效的学习时长');
                return;
            }
            
            // 计算总天数
            const totalDays = timeUnit === 'days' ? timeValue : timeValue * 7;
            
            // 获取当前课程阶段的作业要求
            const homeworkData = getCourseStageData(courseStage, courseType);
            
            // 收集选中的作业项
            const selectedHomework = [];
            const progressHomework = [];
            const checkboxes = document.querySelectorAll('.homework-checkbox:checked');
            
            checkboxes.forEach(checkbox => {
                const type = checkbox.dataset.type;
                const index = parseInt(checkbox.dataset.index);
                const typeData = homeworkData[type];
                
                if (typeData && typeData[index]) {
                    const item = typeData[index];
                    const completedInput = document.querySelector(`input[data-type="${type}"][data-index="${index}"][data-field="completed"]`);
                    const completed = parseInt(completedInput.value) || 0;
                    
                    // 计算总数量（单词类型考虑刷词轮数）
                    let cycleCount = 1;
                    if (type === 'words') {
                        const cycleInput = document.querySelector(`input[data-type="${type}"][data-index="${index}"][data-field="cycle"]`);
                        cycleCount = Math.max(parseInt(cycleInput.value) || 1, 1);
                    }
                    
                    const total = type === 'words' ? item.total * cycleCount : item.total;
                    const homeworkItem = {
                        type: type,
                        name: item.name,
                        unit: item.unit,
                        total: total,
                        baseTotal: item.total,
                        cycleCount: type === 'words' ? cycleCount : 1,
                        completed: Math.min(completed, total),
                        remaining: Math.max(total - completed, 0),
                        planCount: type === 'words' ? timeValue : totalDays,
                        planUnit: type === 'words' ? timeUnit : 'days'
                    };

                    progressHomework.push(homeworkItem);
                    
                    if (completed < total) {
                        selectedHomework.push(homeworkItem);
                    }
                }
            });
            
            if (progressHomework.length === 0) {
                alert('请至少选择一项作业');
                return;
            }
            
            // 计算每日作业量：单词单独计算；其他作业按列表顺序一个接一个排。
            const dailyHomework = buildDailyHomework(selectedHomework, totalDays);
            
            // 保存当前计划数据
            currentPlan = {
                studentName: studentName,
                studentGrade: studentGrade,
                courseType: courseType,
                courseStage: courseStage,
                startDate: startDate,
                timeValue: timeValue,
                timeUnit: timeUnit,
                totalDays: totalDays,
                homework: dailyHomework,
                progressHomework: progressHomework,
                timestamp: new Date().toISOString()
            };

            renderPlan(currentPlan);
        });

        // 更新累计进度表格
        function updateCumulativeTable() {
            if (!currentPlan) return;
            normalizePlanRecord(currentPlan);
            
            const table = document.getElementById('cumulativeTable');
            const thead = table.querySelector('thead');
            const tbody = table.querySelector('tbody');
            thead.innerHTML = '';
            tbody.innerHTML = '';
            
            const totalDays = currentPlan.totalDays;
            const startDate = parseDateString(currentPlan.startDate);
            startDate.setHours(0, 0, 0, 0);
            const startWeekdayIndex = (startDate.getDay() + 6) % 7;
            const totalSlots = startWeekdayIndex + totalDays;
            const totalWeeks = Math.ceil(totalSlots / 7);
            const weekdayLabels = getShimoWeekdayLabels();
            const fullCellStyle = 'height:auto;white-space:pre-line;overflow:visible;vertical-align:top;line-height:1.6;';
            const fullCenterCellStyle = `${fullCellStyle}text-align:center;`;
            const scheduleByItem = updatePlanSequencedStats(currentPlan);
            const cumulativeByItem = scheduleByItem.map(amounts => {
                let cumulative = 0;
                return amounts.map(amount => {
                    cumulative += Number(amount) || 0;
                    return cumulative;
                });
            });
            const shimoRows = currentPlan.homework.flatMap((item, itemIndex) => {
                if (item.type !== 'words') {
                    return [{
                        label: getNonWordTaskLabel(item),
                        cells: scheduleByItem[itemIndex],
                        renderCell: scheduleIndex => getNonWordCellHtml(
                            item,
                            scheduleByItem[itemIndex][scheduleIndex],
                            cumulativeByItem[itemIndex][scheduleIndex]
                        )
                    }];
                }

                const baseTotal = getBaseTotal(currentPlan, item);
                const totalRounds = getCycleCount(currentPlan, item);
                const roundCells = Array.from({ length: totalRounds }, () => Array(totalDays).fill(null));
                let currentRoundIndex = 0;
                let currentRoundProgress = 0;

                scheduleByItem[itemIndex].forEach((amount, scheduleIndex) => {
                    const numericAmount = Number(amount) || 0;
                    if (!numericAmount || currentRoundIndex >= totalRounds) {
                        return;
                    }

                    const appliedAmount = Math.min(numericAmount, baseTotal - currentRoundProgress);
                    currentRoundProgress += appliedAmount;
                    roundCells[currentRoundIndex][scheduleIndex] = {
                        amount: appliedAmount,
                        progress: currentRoundProgress,
                        roundEnded: currentRoundProgress >= baseTotal
                    };

                    if (currentRoundProgress >= baseTotal) {
                        currentRoundIndex += 1;
                        currentRoundProgress = 0;
                    }
                });

                return roundCells
                    .map((cells, roundIndex) => ({
                        label: getWordTaskLabel(item, baseTotal, roundIndex + 1),
                        renderCell: scheduleIndex => getWordCellHtml(
                            currentPlan,
                            item,
                            cells[scheduleIndex],
                            roundIndex + 1,
                            totalRounds
                        ),
                        roundIndex,
                        cells
                    }))
                    .filter(row => row.roundIndex === 0 || row.cells.some(Boolean));
            });
            
            let currentMonthLabel = '';

            for (let weekIndex = 0; weekIndex < totalWeeks; weekIndex++) {
                const monthLabel = getWeekMonthLabel(startDate, totalDays, weekIndex, startWeekdayIndex);

                if (monthLabel && monthLabel !== currentMonthLabel) {
                    const monthRow = document.createElement('tr');
                    monthRow.innerHTML = `
                        <th colspan="8" class="shimo-month-title border border-gray-300 px-4 py-2" style="${fullCellStyle}">
                            ${monthLabel}课表
                        </th>
                    `;
                    tbody.appendChild(monthRow);
                    currentMonthLabel = monthLabel;
                }

                const weekdayRow = document.createElement('tr');
                weekdayRow.className = 'bg-slate-100';
                weekdayRow.innerHTML = `
                    <th class="border border-gray-300 px-4 py-2 text-sm font-semibold text-center min-w-[220px]" style="${fullCenterCellStyle}">任务列表</th>
                    ${weekdayLabels.map(label => `
                        <th class="border border-gray-300 px-4 py-2 text-sm font-semibold min-w-[120px]" style="${fullCenterCellStyle}">${label}</th>
                    `).join('')}
                `;
                tbody.appendChild(weekdayRow);

                const dateRow = document.createElement('tr');
                dateRow.className = 'bg-slate-50';
                dateRow.innerHTML = `
                    <td class="border border-gray-300 px-4 py-2 text-sm font-medium text-center" style="${fullCenterCellStyle}">日期</td>
                    ${weekdayLabels.map((_, dayIndex) => {
                        const scheduleIndex = weekIndex * 7 + dayIndex - startWeekdayIndex;
                        if (scheduleIndex < 0 || scheduleIndex >= totalDays) {
                            return `<td class="border border-gray-300 px-4 py-2 text-sm" style="${fullCellStyle}"></td>`;
                        }

                        const date = new Date(startDate);
                        date.setDate(startDate.getDate() + scheduleIndex);
                        return `<td class="border border-gray-300 px-4 py-2 text-sm font-medium" style="${fullCenterCellStyle}">${formatShimoDate(date)}</td>`;
                    }).join('')}
                `;
                tbody.appendChild(dateRow);

                const weekRows = shimoRows.filter(rowConfig => {
                    if (!rowConfig.cells) {
                        return true;
                    }

                    return weekdayLabels.some((_, dayIndex) => {
                        const scheduleIndex = weekIndex * 7 + dayIndex - startWeekdayIndex;
                        if (scheduleIndex < 0 || scheduleIndex >= totalDays) {
                            return false;
                        }

                        return Boolean(rowConfig.cells[scheduleIndex]);
                    });
                });

                weekRows.forEach(rowConfig => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="border border-gray-300 px-4 py-3 text-sm text-left whitespace-pre-line align-top" style="${fullCellStyle}">${rowConfig.label}</td>
                        ${weekdayLabels.map((_, dayIndex) => {
                            const scheduleIndex = weekIndex * 7 + dayIndex - startWeekdayIndex;
                            if (scheduleIndex < 0 || scheduleIndex >= totalDays) {
                                return `<td class="border border-gray-300 px-4 py-3 text-sm align-top" style="${fullCellStyle}"></td>`;
                            }

                            return `
                                <td class="border border-gray-300 px-4 py-3 text-sm text-center whitespace-pre-line align-top" style="${fullCenterCellStyle}">
                                    ${rowConfig.renderCell(scheduleIndex)}
                                </td>
                            `;
                        }).join('')}
                    `;
                    tbody.appendChild(row);
                });
            }
        }

            historyContent.innerHTML = '';

            if (history.length === 0) {
                historyContent.innerHTML = '<p class="text-center text-gray-500 py-8">暂无历史记录</p>';
                return;
            }

            const historyList = document.createElement('div');
            historyList.className = 'space-y-4';

            history.forEach((record, index) => {
                const normalizedRecord = clonePlanRecord(record);
                const date = new Date(normalizedRecord.timestamp);
                const dateStr = date.toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const stageText = getStageDisplayText(normalizedRecord);
                const recordCard = document.createElement('div');
                recordCard.className = 'bg-white p-4 rounded-lg border border-gray-200';
                recordCard.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h4 class="text-md font-semibold">${escapeHtml(normalizedRecord.studentName)} (${escapeHtml(normalizedRecord.studentGrade)})</h4>
                            <p class="text-sm text-gray-500">${escapeHtml(normalizedRecord.courseType)} ${escapeHtml(stageText)} - ${normalizedRecord.timeValue}${normalizedRecord.timeUnit === 'days' ? '天' : '周'}计划</p>
                        </div>
                        <span class="text-xs text-gray-400">${dateStr}</span>
                    </div>
                    <div class="flex justify-end space-x-2">
                        <button class="view-history btn-outline text-sm py-1 px-3" data-index="${index}">
                            <i class="fa fa-eye mr-1"></i>查看
                        </button>
                        <button class="record-progress-history btn-primary text-sm py-1 px-3" data-index="${index}">
                            <i class="fa fa-pencil mr-1"></i>录入该进度
                        </button>
                        <button class="delete-history btn-outline text-red-500 text-sm py-1 px-3" data-index="${index}">
                            <i class="fa fa-trash mr-1"></i>删除
                        </button>
                    </div>
                `;
                historyList.appendChild(recordCard);
            });

            historyContent.appendChild(historyList);

            document.querySelectorAll('.view-history').forEach(btn => {
                btn.addEventListener('click', function() {
                    renderHistoryDetail(history, parseInt(this.dataset.index));
                });
            });

            document.querySelectorAll('.record-progress-history').forEach(btn => {
                btn.addEventListener('click', function() {
                    useHistoryProgress(clonePlanRecord(history[parseInt(this.dataset.index)]));
                });
            });

            document.querySelectorAll('.delete-history').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = parseInt(this.dataset.index);

                    history.splice(index, 1);
                    localStorage.setItem('homeworkHistory', JSON.stringify(history));
                    renderHistoryList(history);
                });
            });
        }

        function renderHistoryDetail(history, index) {
            const record = clonePlanRecord(history[index]);
            const summaries = getAssignedSummaries(record);
            const stageText = getStageDisplayText(record);
            const date = new Date(record.timestamp);
            const dateStr = date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });

            historyContent.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-lg border border-gray-200">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="text-lg font-semibold">${escapeHtml(record.studentName)} (${escapeHtml(record.studentGrade)})</h4>
                                <p class="text-sm text-gray-500">${escapeHtml(record.courseType)} ${escapeHtml(stageText)} - ${record.timeValue}${record.timeUnit === 'days' ? '天' : '周'}计划</p>
                            </div>
                            <span class="text-xs text-gray-400">${dateStr}</span>
                        </div>
                    </div>
                    <div class="bg-white p-4 rounded-lg border border-gray-200">
                        <h4 class="text-md font-semibold mb-4">上次布置的作业量</h4>
                        <div class="space-y-4">
                            ${summaries.map(summary => `
                                <div class="flex justify-between items-start border border-gray-200 rounded-lg p-4">
                                    <div>
                                        <p class="text-sm font-medium">${escapeHtml(summary.item.name)}</p>
                                        <p class="text-xs text-gray-500">原已完成 ${summary.previousCompleted} ${escapeHtml(summary.item.unit)}，上次布置 ${summary.assignedTotal} ${escapeHtml(summary.item.unit)}</p>
                                    </div>
                                    <div class="text-sm text-right">
                                        <p>使用后已完成 ${summary.afterCompleted} ${escapeHtml(summary.item.unit)}</p>
                                        <p class="text-gray-500">还剩 ${summary.remainingAfter} ${escapeHtml(summary.item.unit)}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="flex justify-end space-x-2">
                        <button id="backHistoryListBtn" class="btn-outline">
                            <i class="fa fa-arrow-left mr-1"></i>返回
                        </button>
                        <button id="useHistoryProgressBtn" class="btn-primary">
                            <i class="fa fa-pencil mr-1"></i>录入该进度
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('backHistoryListBtn').addEventListener('click', function() {
                renderHistoryList(history);
            });

            document.getElementById('useHistoryProgressBtn').addEventListener('click', function() {
                useHistoryProgress(record);
            });
        }

        function useHistoryProgress(record) {
            const progressPlan = buildProgressPlanFromHistory(record);

            studentNameInput.value = progressPlan.studentName;
            studentGradeInput.value = progressPlan.studentGrade;
            courseTypeSelect.value = progressPlan.courseType;
            startDateInput.value = getTodayDateString();
            timeValueInput.value = progressPlan.timeValue;
            timeUnitSelect.value = progressPlan.timeUnit;

            updateCourseStageOptions();
            courseStageSelect.value = progressPlan.courseStage;
            courseStageSelect.dispatchEvent(new Event('change'));
            restoreHomeworkForm(progressPlan);

            historyModal.classList.add('hidden');

            if (progressPlan.homework.some(item => item.completed < item.total)) {
                generateBtn.click();
            } else {
                resultCard.classList.add('hidden');
                document.getElementById('actionButtons').classList.add('hidden');
                alert('这条历史记录里的作业按上次布置量计算后已经全部完成；已完成数量已经填到表单里。');
            }
        }

        // 显示历史记录
        historyBtn.addEventListener('click', function() {
            const history = JSON.parse(localStorage.getItem('homeworkHistory') || '[]');
            history.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            renderHistoryList(history);
            historyModal.classList.remove('hidden');
        });
        
        // 关闭历史记录模态框
        closeHistoryBtn.addEventListener('click', function() {
            historyModal.classList.add('hidden');
        });
        
        closeHistoryBtn2.addEventListener('click', function() {
            historyModal.classList.add('hidden');
        });
        
        // 清空历史记录
        clearHistoryBtn.addEventListener('click', function() {
            if (confirm('确定要清空所有历史记录吗？此操作不可恢复。')) {
                localStorage.removeItem('homeworkHistory');
                historyBtn.click();
            }
        });
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 绑定AI识别按钮事件
            aiRecognizeBtn.addEventListener('click', recognizeStudentInfo);
            
            // 初始化课程阶段选择框
            updateCourseStageOptions();

            // 初始化起始日期
            startDateInput.value = getTodayDateString();
        });
    </script>
</body>
</html>
